<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Record - HR Compliance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <i class="fas fa-shield-alt" style="color: var(--primary);"></i> CertTrack
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item"><i class="fas fa-th-large"></i> Dashboard</a>
            <a href="employee-forms.html" class="nav-item active"><i class="fas fa-user-plus"></i> Add Record</a>
            <a href="index.html" class="nav-item" style="margin-top: auto;"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <div class="main-wrapper">
        <header class="topbar">
            <h2 style="font-size: 1.1rem; color: var(--text-muted); font-weight: 500;">Database / Insert Record</h2>
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600;">HR</div>
        </header>

        <main class="content">
            <div class="page-header">
                <div>
                    <h1 style="font-size: 1.75rem; margin-bottom: 8px;">Register Certification</h1>
                    <p style="color: var(--text-muted);">Fill out the form below to append a new compliance record.</p>
                </div>
            </div>

            <form id="recordForm" class="form-grid">
                <div class="form-group full-width" style="border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 8px;">
                    <h3 style="color: var(--text-main); font-size: 1.1rem;">Employee Information</h3>
                </div>

                <div class="form-group">
                    <label>Employee ID *</label>
                    <input type="text" id="empId" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="empName" required autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label>Department *</label>
                    <select id="empDept" required>
                        <option value="" disabled selected>Select Department</option>
                        <option value="AI & Machine Learning">AI & Machine Learning</option>
                        <option value="Data Engineering">Data Engineering</option>
                        <option value="Infrastructure Solutions">Infrastructure Solutions</option>
                        <option value="HR Operations">HR Operations</option>
                        <option value="Finance & Legal">Finance & Legal</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Office Location *</label>
                    <select id="empLoc" required>
                        <option value="" disabled selected>Select Location</option>
                        <option value="HITEC City Campus">HITEC City Campus</option>
                        <option value="Gachibowli Phase 2">Gachibowli Phase 2</option>
                        <option value="Cyberabad GCC">Cyberabad GCC</option>
                        <option value="Hyderabad HQ">Hyderabad HQ</option>
                    </select>
                </div>

                <div class="form-group full-width" style="border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 8px; margin-top: 16px;">
                    <h3 style="color: var(--text-main); font-size: 1.1rem;">Certification Details</h3>
                </div>

                <div class="form-group full-width">
                    <label>Certification Name *</label>
                    <input type="text" id="certName" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label>Issue Date *</label>
                    <input type="date" id="issueDate" required>
                </div>
                <div class="form-group">
                    <label>Expiry Date *</label>
                    <input type="date" id="expiryDate" required>
                </div>

                <div class="form-group full-width" style="margin-top: 16px;">
                    <button type="submit" class="btn-primary" style="width: fit-content; padding: 12px 24px;">
                        <i class="fas fa-save"></i> Save to Database
                    </button>
                </div>
            </form>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
