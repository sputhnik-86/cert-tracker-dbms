<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - HR Compliance</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-base);
        }

        .login-container {
            background: var(--bg-surface);
            padding: 48px 40px;
            border-radius: 12px;
            border: 1px solid var(--border);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .login-header i {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .login-header h1 {
            font-size: 1.5rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
        }

        .input-wrapper input {
            padding-left: 40px;
            width: 100%;
        }

        #error-msg {
            display: none;
            background: var(--danger-bg);
            color: var(--danger-text);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 24px;
            font-size: 0.875rem;
            text-align: center;
            border: 1px solid rgba(239, 68, 68, 0.2);
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-shield-alt"></i>
            <h1>CertTrack Portal</h1>
            <p>Enter your credentials to access the system</p>
        </div>

        <div id="error-msg">
            <i class="fas fa-exclamation-circle"></i> Invalid email or password.
        </div>

        <form id="loginForm" class="form-group" style="gap: 20px;">
            <div class="form-group">
                <label>Work Email</label>
                <div class="input-wrapper">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" required autocomplete="off" placeholder="admin@company.com">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
            </div>

            <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; padding: 14px; margin-top: 12px; font-size: 1rem; font-weight: 600;">
                Sign In <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = this.querySelector('button');
            const errorMsg = document.getElementById('error-msg');
            const originalBtnText = btn.innerHTML;
            
            errorMsg.style.display = 'none';
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';
            btn.disabled = true;

            setTimeout(() => {
                if (email === 'admin@company.com' && password === 'admin123') {
                    window.location.href = 'dashboard.html';
                } else {
                    errorMsg.style.display = 'block';
                    btn.innerHTML = originalBtnText;
                    btn.disabled = false;
                    
                    errorMsg.animate([
                        { transform: 'translateX(0)' },
                        { transform: 'translateX(-5px)' },
                        { transform: 'translateX(5px)' },
                        { transform: 'translateX(0)' }
                    ], { duration: 300 });
                }
            }, 1200);
        });
    </script>
</body>
</html>
